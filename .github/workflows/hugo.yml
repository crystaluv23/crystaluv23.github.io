name: Build and deploy Hugo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: '0.164.0'
  HUGO_ENVIRONMENT: production
  DEFAULT_BASE_URL: https://crystaluv23.github.io/
  TZ: Asia/Shanghai

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source and pinned theme
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Hugo extended release
        run: |
          set -euo pipefail
          test "$(cat .hugo-version)" = "$HUGO_VERSION"
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          install_dir="$RUNNER_TEMP/hugo"
          mkdir -p "$install_dir"
          cd "$install_dir"
          curl --fail --silent --show-error --location --retry 3 "$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location --retry 3 "$release/hugo_${HUGO_VERSION}_checksums.txt" --output checksums.txt
          awk -v archive="$archive" '$2 == archive { print }' checksums.txt > archive.sha256
          sha256sum --check --strict archive.sha256
          tar -xzf "$archive" hugo
          echo "$install_dir" >> "$GITHUB_PATH"
          ./hugo version

      # Pull requests, including forks, never need Pages to be enabled.
      - name: Read GitHub Pages URL
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build and check site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          site_url="${PAGES_BASE_URL:-$DEFAULT_BASE_URL}"
          hugo --gc --minify --cleanDestinationDir --panicOnWarning --baseURL "${site_url%/}/"
          python3 scripts/check_site.py public

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
