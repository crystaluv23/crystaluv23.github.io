baseURL: https://crystaluv23.github.io/
title: L’s Log
theme: PaperMod
locale: en-US
defaultContentLanguage: en
hasCJKLanguage: true
timeZone: Asia/Shanghai
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
pagination:
  pagerSize: 10

outputs:
  home: [HTML, RSS, JSON]

params:
  env: production
  title: L’s Log
  description: A place for learning notes, ideas, and things worth remembering.
  author: L
  mainSections: [posts]
  DateFormat: January 2, 2006
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowToc: true
  TocOpen: false
  UseHugoToc: true
  comments: false
  math: true
  homeInfoParams:
    Title: 👋 Welcome to L’s Log
    Content: Hi, this is L. A place for learning notes, ideas, and things worth remembering.
  assets:
    favicon: favicon.svg
    favicon16x16: favicon-16x16.png
    favicon32x32: favicon-32x32.png
    apple_touch_icon: apple-touch-icon.png
    safari_pinned_tab: favicon.svg
    disableHLJS: true
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    ignoreLocation: true
    threshold: 0.4
    minMatchCharLength: 1
    keys: [title, permalink, summary, content]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /
      weight: 10
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40
    - identifier: faq
      name: FAQ
      url: /faq/
      weight: 50

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]
  highlight:
    noClasses: true
    style: monokai
  tableOfContents:
    startLevel: 2
    endLevel: 4

caches:
  images:
    dir: :cacheDir/images
